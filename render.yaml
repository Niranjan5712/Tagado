services:
  - type: web
    name: tagado
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/tagado.db
      - key: DEMO_EMAIL
        value: demo@tagado.app
      - key: DEMO_PASSWORD
        value: tagado-demo-2026
      - key: DEMO_OWNER_NAME
        value: Priya
      - key: DEMO_BUSINESS_NAME
        value: Pixelcraft Studio

# Free tier has no persistent disk: SQLite resets when the free instance recycles.
# After first deploy, set APP_URL to https://<service>.onrender.com (no trailing slash) and redeploy.
